
<!DOCTYPE html>
<html>
<head>
  <title>Item Viewer</title>
  <script type='module' src='https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js'></script>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <header><h1>Exhibit Item</h1></header>
  <div class='container'>
    <div id='item-details'></div>
    <model-viewer id='viewer' src='' ar ar-modes='scene-viewer webxr quick-look' auto-rotate camera-controls style='width: 100%; height: 500px;'>
    </model-viewer>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const itemId = params.get('id');
    fetch('data/items.json')
      .then(res => res.json())
      .then(data => {
        const item = data[itemId];
        if (item) {
          document.getElementById('item-details').innerHTML = `<h2>${item.name}</h2><p>${item.desc}</p><img src='${item.image}' />`;
          document.getElementById('viewer').setAttribute('src', item.model);
        }
      });
  </script>
</body>
</html>
