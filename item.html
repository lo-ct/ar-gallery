
<!DOCTYPE html>
<html>
<head>
  <title>Item Viewer</title>
  <script type='module' src='https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js'></script>
  <link rel='stylesheet' href='style.css'>
  <script src='https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js'></script>
  <script src='https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js'></script>
  <script src='js/firebase-config.js'></script>
</head>
<body>
  <header><h1>Exhibit Item</h1></header>
  <nav>
    <a href='index.html'>Home</a>
    <a href='add-item.html'>Add Item</a>
    <a href='items.html'>View Items</a>
  </nav>
  <div class='container'>
    <div id='item-details'></div>
    <model-viewer id='viewer' src='' ar ar-modes='scene-viewer webxr quick-look' auto-rotate camera-controls style='width: 100%; height: 500px;'>
    </model-viewer>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const itemId = params.get('id');
    db.collection('items').doc(itemId).get().then(doc => {
      if (doc.exists) {
        const item = doc.data();
        document.getElementById('item-details').innerHTML = `<h2>${item.name}</h2><p>${item.desc}</p><img src='${item.image}' />`;
        document.getElementById('viewer').setAttribute('src', item.model);
      }
    });
  </script>
</body>
</html>
